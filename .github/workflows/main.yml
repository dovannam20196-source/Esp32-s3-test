#include <WiFi.h>
#include <WebServer.h>
#include <Update.h>
#include <math.h>

const char* AP_SSID = "TuLanh_Toshiba_Test";
const char* AP_PASS = "88888888";

// 4 Cảm biến (Trở 3.6k lên 3.3V, Cảm biến xuống GND)
#define PIN_CB_XADA      32  // 5k Toshiba
#define PIN_CB_NGANMAT   33  // 10k B3950
#define PIN_CB_NGANDA    34  // 2k Toshiba
#define PIN_CB_MOITRUONG 35  // 2k Toshiba

// 4 Kênh Relay (Kích mức THẤP - LOW)
#define PIN_RL_XADA      16  // IN1 -> NO1: Xả đá
#define PIN_RL_BLOCK_PWR 17  // IN2 -> NO2: Nguồn bo CS lốc
#define PIN_RL_DEN       22  // IN4 -> NO4: Đèn LED khoang tủ 12V

// Quạt, Lốc PWM & Công tắc cửa
#define PIN_PWM_BLOCK    25  // PWM điều tốc lốc
#define PIN_PWM_QUAT     21  // Dây Tím: PWM điều tốc quạt
#define PIN_HALL_QUAT    26  // Dây Vàng: Đọc xung Hall quạt
#define PIN_CONGTAC_CUA  27  // Công tắc cửa

// Bo phím zin 7 chân CN1
#define PIN_NUT_SW1      18  // Dây Đỏ: Nút nhấn chọn mức nhiệt
#define PIN_LED4         19  // Dây Xanh dương: LED4
#define PIN_LED3         23  // Dây Tím: LED3
#define PIN_LED2         5   // Dây Vàng: LED2 (Chân G5)
#define PIN_LED1         4   // Dây Hồng: LED1 (Chân G4)

const float R_PULLUP = 3600.0;
const int PWM_FREQ_BLOCK = 1000;
const int PWM_FREQ_FAN   = 25000;
const int PWM_RES        = 8;

float tXaDa = 0, tNganMat = 0, tNganDa = 0, tMoiTruong = 0;
int mucNhiet = 1;
int testFanPct = 0;
int testBlockPct = 0;
bool testXaDa = false;
bool cuaMo = false;

volatile unsigned long xungHall = 0;
int fanRPM = 0;
unsigned long lastHallCalc = 0;

WebServer server(80);

void IRAM_ATTR ngatHall() {
  xungHall++;
}

float docNhietDo(int pin, float r25, float beta) {
  long tongADC = 0;
  for (int i = 0; i < 20; i++) {
    tongADC += analogRead(pin);
    delayMicroseconds(200);
  }
  float adc = tongADC / 20.0;
  if (adc < 50 || adc > 4040) return -99.9;
  float rNTC = R_PULLUP * (adc / (4095.0 - adc));
  float steinhart = log(rNTC / r25) / beta + 1.0 / (25.0 + 273.15);
  return (1.0 / steinhart) - 273.15;
}

void capNhatLedBoPhim() {
  digitalWrite(PIN_LED1, mucNhiet == 1 ? HIGH : LOW);
  digitalWrite(PIN_LED2, mucNhiet == 2 ? HIGH : LOW);
  digitalWrite(PIN_LED3, mucNhiet == 3 ? HIGH : LOW);
  digitalWrite(PIN_LED4, mucNhiet == 4 ? HIGH : LOW);
}

const char INDEX_HTML[] PROGMEM = R"rawliteral(
