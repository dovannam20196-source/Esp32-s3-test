name: Build ESP32S3

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ~/.arduino15
          gh release download 3.3.13 -R espressif/arduino-esp32 -p "package_esp32_index.json"
          arduino-cli core update-index --additional-urls "file://$(pwd)/package_esp32_index.json"
          arduino-cli core install esp32:esp32@3.3.13 --additional-urls "file://$(pwd)/package_esp32_index.json"
      - name: Build
        run: |
          echo "--- Danh sach file trong repo ---"
          find . -maxdepth 3 -not -path '*/.*'
          CODE_FILE=$(find . -not -path '*/.*' \( -name "*.ino" -o -name "*.cpp" \) | head -n 1)
          if [ -z "$CODE_FILE" ]; then
            echo "LOI: Khong tim thay bat ky file code .ino hay .cpp nao trong repo!"
            exit 1
          fi
          mkdir -p /tmp/sketch
          cp "$CODE_FILE" /tmp/sketch/sketch.ino
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi --output-dir ./build /tmp/sketch
      - uses: actions/upload-artifact@v5
        with:
          name: firmware-bin
          path: ./build/*.bin
          
