name: Build ESP32-S3 Samsung
on: [push]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -U platformio
          mkdir -p src
          cat << 'EOF' > platformio.ini
          [env:esp32s3]
          platform = espressif32
          board = esp32-s3-devkitc-1
          framework = arduino
          EOF
          cat << 'EOF' > src/main.cpp
          #include <Arduino.h>
          #include <WiFi.h>
          #include <WebServer.h>

          int dmP0 = 4, dmP1 = 5, dmP2 = 6, dmP3 = 7;
          int dmMode = 1;
          bool dispSwap = false;
          long dispBaud = 9600;
          int tempR = 4;
          String rxHex = "Trong";
          WebServer server(80);

          void setDm(int m) {
            dmMode = m;
            if (m == 1) { dmP0=4; dmP1=5; dmP2=6; dmP3=7; }
            if (m == 2) { dmP0=4; dmP1=6; dmP2=5; dmP3=7; }
            if (m == 3) { dmP0=4; dmP1=6; dmP2=7; dmP3=5; }
            pinMode(dmP0, OUTPUT); pinMode(dmP1, OUTPUT);
            pinMode(dmP2, OUTPUT); pinMode(dmP3, OUTPUT);
          }

          void runDm(bool open) {
            for (int s = 0; s < 500; s++) {
              int i = open ? (s % 4) : (3 - (s % 4));
              digitalWrite(dmP0, i==0 || i==3);
              digitalWrite(dmP1, i==0 || i==1);
              digitalWrite(dmP2, i==1 || i==2);
              digitalWrite(dmP3, i==2 || i==3);
              delay(8);
            }
            digitalWrite(dmP0, 0); digitalWrite(dmP1, 0);
            digitalWrite(dmP2, 0); digitalWrite(dmP3, 0);
          }

          void initUart() {
            Serial1.end(); delay(50);
            Serial1.begin(dispBaud, SERIAL_8N1, dispSwap ? 15 : 16, dispSwap ? 16 : 15);
          }

          void handleRoot() {
            String h = "<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>";
            h += "<style>body{background:#111;color:#fff;font-family:sans-serif;padding:15px}button{padding:12px;margin:4px;font-size:15px;background:#0284c7;color:#fff;border:none;border-radius:6px}</style></head><body>";
            h += "<h3>1. DAMPER (Pha " + String(dmMode) + ")</h3>";
            h += "<a href='/dm?m=1'><button>Pha 1</button></a><a href='/dm?m=2'><button>Pha 2</button></a><a href='/dm?m=3'><button>Pha 3</button></a><br>";
            h += "<a href='/t?c=open'><button>MO GIO</button></a><a href='/t?c=close'><button>DONG GIO</button></a>";
            h += "<h3>2. BO KHIEN (" + String(dispSwap ? "16/15" : "15/16") + " - " + String(dispBaud) + ")</h3>";
            h += "Nhan ve: <b>" + rxHex + "</b><br>";
            h += "<a href='/u?s=1'><button>Dao TX/RX</button></a><a href='/u?b=2400'><button>2400</button></a><a href='/u?b=4800'><button>4800</button></a><a href='/u?b=9600'><button>9600</button></a><br>";
            h += "<a href='/t?c=beep'><button>Test Bo Khien</button></a>";
            h += "<h3>3. TAI KHAC</h3>";
            h += "<a href='/t?c=fan'><button>Quat 20</button></a><a href='/t?c=def'><button>Xa Da 21</button></a><a href='/t?c=lr'><button>Den Mat 17</button></a><a href='/t?c=lf'><button>Den Da 18</button></a>";
            h += "</body></html>";
            server.send(200, "text/html", h);
          }

          void setup() {
            pinMode(17, OUTPUT); pinMode(18, OUTPUT);
            pinMode(20, OUTPUT); pinMode(21, OUTPUT);
            digitalWrite(17, 1);
            setDm(1); initUart();
            WiFi.softAP("Samsung_TuLanh_S3", "12345678");
            server.on("/", handleRoot);
            server.on("/dm", [](){ setDm(server.arg("m").toInt()); server.sendHeader("Location","/"); server.send(303); });
            server.on("/u", [](){
              if(server.hasArg("s")) dispSwap = !dispSwap;
              if(server.hasArg("b")) dispBaud = server.arg("b").toInt();
              initUart(); server.sendHeader("Location","/"); server.send(303);
            });
            server.on("/t", [](){
              String c = server.arg("c");
              if(c=="open") runDm(true);
              if(c=="close") runDm(false);
              if(c=="fan") digitalWrite(20, !digitalRead(20));
              if(c=="def") digitalWrite(21, !digitalRead(21));
              if(c=="lr") digitalWrite(17, !digitalRead(17));
              if(c=="lf") digitalWrite(18, !digitalRead(18));
              if(c=="beep") { uint8_t p[4]={0xAA, 0x04, 0x00, 0xAE}; Serial1.write(p, 4); }
              server.sendHeader("Location","/"); server.send(303);
            });
            server.begin();
          }

          void loop() {
            server.handleClient();
            if (Serial1.available()) {
              rxHex = "";
              while (Serial1.available()) rxHex += String(Serial1.read(), HEX) + " ";
            }
          }
          EOF
          pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: .pio/build/esp32s3/*.bin
          
