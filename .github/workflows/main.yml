name: Build Samsung S3 ADT8700A 12V

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Firmware
        run: |
          pip install -U platformio
          mkdir -p src
          cat << 'EOF' > platformio.ini
          [env:esp32s3]
          platform = espressif32
          board = esp32-s3-devkitc-1
          framework = arduino
          board_build.arduino.memory_type = qio_opi
          board_build.flash_mode = qio
          board_build.psram_type = opi
          board_upload.flash_size = 16MB
          EOF

          cat << 'EOF' > src/main.cpp
          #include <Arduino.h>
          #include <WiFi.h>
          #include <WebServer.h>

          // --- DAMPER PHA 2 CHUAN (4-6-5-7) ---
          int dmP0 = 4, dmP1 = 6, dmP2 = 5, dmP3 = 7;
          #define PIN_LIGHT_R  17
          #define PIN_LIGHT_F  18
          #define PIN_FAN      20
          #define PIN_DEFROST  21

          WebServer server(80);
          long dispBaud = 9600;
          bool use8E1 = true;
          bool invertTx = true; // Bat dao cuc TX vi di qua ULN2803G keo Mass 12V
          int scanMode = 1;
          String lastRxHex = "Dang cho phan hoi 12V...";

          void stepWrite(int idx) {
            if (idx == 0) { digitalWrite(dmP0, 1); digitalWrite(dmP1, 1); digitalWrite(dmP2, 0); digitalWrite(dmP3, 0); }
            if (idx == 1) { digitalWrite(dmP0, 0); digitalWrite(dmP1, 1); digitalWrite(dmP2, 1); digitalWrite(dmP3, 0); }
            if (idx == 2) { digitalWrite(dmP0, 0); digitalWrite(dmP1, 0); digitalWrite(dmP2, 1); digitalWrite(dmP3, 1); }
            if (idx == 3) { digitalWrite(dmP0, 1); digitalWrite(dmP1, 0); digitalWrite(dmP2, 0); digitalWrite(dmP3, 1); }
          }

          void runDamper(bool openCmd) {
            for (int step = 0; step < 500; step++) {
              int idx = openCmd ? (3 - (step % 4)) : (step % 4);
              stepWrite(idx);
              delay(8);
            }
            digitalWrite(dmP0, 0); digitalWrite(dmP1, 0); digitalWrite(dmP2, 0); digitalWrite(dmP3, 0);
          }

          void restartDisplayUart() {
            Serial1.end();
            delay(50);
            uint32_t cfg = use8E1 ? SERIAL_8E1 : SERIAL_8N1;
            // GPIO 16 = RX (qua cau phan ap), GPIO 15 = TX (qua ULN2803G dao cuc)
            Serial1.begin(dispBaud, cfg, 16, 15, false);
            Serial1.setTxInvert(invertTx);
          }

          void sendADT8700Packet() {
            if (scanMode == 1) {
              // Khung danh thuc & hien thi 3C / -23C chuan Samsung RS62R (0xAA)
              uint8_t pkt[] = {0xAA, 0x09, 0x01, 0x03, 0x17, 0x00, 0x00, 0x00, 0xB8};
              Serial1.write(pkt, sizeof(pkt));
            } else if (scanMode == 2) {
              // Khung test bat sang toan bo thanh LED 7 doan
              uint8_t pkt[] = {0xAA, 0x09, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xA0};
              Serial1.write(pkt, sizeof(pkt));
            } else if (scanMode == 3) {
              // Khung giao tiep doi 0x55
              uint8_t pkt[] = {0x55, 0xAA, 0x08, 0x03, 0x17, 0x01, 0x00, 0x1E};
              Serial1.write(pkt, sizeof(pkt));
            }
          }

          void handleRoot() {
            String html = "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>";
            html += "<style>body{font-family:sans-serif;background:#111;color:#eee;padding:12px;}.card{background:#222;padding:14px;border-radius:10px;margin-bottom:12px;}button{padding:11px 14px;font-size:14px;margin:4px;border-radius:8px;border:none;background:#0284c7;color:#fff;}.act{background:#16a34a;}.warn{background:#d97706;}</style></head><body>";
            html += "<h3>KICH KHIEN ADT8700A (BUS 12V)</h3>";
            html += "<div class='card'><b>1. Trang Thai Bus 12V (T8700A)</b><br>";
            html += "Chuan: <b>" + String(use8E1 ? "8E1" : "8N1") + "</b> | Baud: <b>" + String(dispBaud) + "</b> | TX: <b>" + String(invertTx ? "Dao cuc (ULN2803)" : "Thuan") + "</b><br>";
            html += "Tin hieu nhan ve: <b style='color:#4ade80;'>" + lastRxHex + "</b><br><br>";
            html += "<a href='/u?p=1'><button class='" + String(use8E1?"act":"") + "'>8E1</button></a>";
            html += "<a href='/u?p=0'><button class='" + String(!use8E1?"act":"") + "'>8N1</button></a>";
            html += "<a href='/u?inv=1'><button class='warn'>Dao Cuc TX</button></a><br>";
            html += "<a href='/u?b=9600'><button class='" + String(dispBaud==9600?"act":"") + "'>9600</button></a>";
            html += "<a href='/u?b=4800'><button class='" + String(dispBaud==4800?"act":"") + "'>4800</button></a>";
            html += "<a href='/u?b=2400'><button class='" + String(dispBaud==2400?"act":"") + "'>2400</button></a><br><br>";
            html += "<b>Goi Lenh ADT8700A:</b><br>";
            html += "<a href='/u?m=1'><button class='" + String(scanMode==1?"act":"") + "'>Goi 1 (3C/-23C)</button></a>";
            html += "<a href='/u?m=2'><button class='" + String(scanMode==2?"act":"") + "'>Goi 2 (All LED)</button></a>";
            html += "<a href='/u?m=3'><button class='" + String(scanMode==3?"act":"") + "'>Goi 3 (0x55)</button></a>";
            html += "<a href='/'><button style='background:#475569;'>Lam Moi</button></a></div>";
            html += "<div class='card'><b>2. Damper Pha 2 Chuan</b><br>";
            html += "<a href='/t?d=open'><button class='act'>MO DAMPER</button></a>";
            html += "<a href='/t?d=close'><button style='background:#dc2626;'>DONG DAMPER</button></a></div>";
            html += "</body></html>";
            server.send(200, "text/html", html);
          }

          void setup() {
            pinMode(dmP0, OUTPUT); digitalWrite(dmP0, 0);
            pinMode(dmP1, OUTPUT); digitalWrite(dmP1, 0);
            pinMode(dmP2, OUTPUT); digitalWrite(dmP2, 0);
            pinMode(dmP3, OUTPUT); digitalWrite(dmP3, 0);
            pinMode(PIN_FAN, OUTPUT); digitalWrite(PIN_FAN, 0);
            pinMode(PIN_DEFROST, OUTPUT); digitalWrite(PIN_DEFROST, 0);
            pinMode(PIN_LIGHT_R, OUTPUT); digitalWrite(PIN_LIGHT_R, 0);
            pinMode(PIN_LIGHT_F, OUTPUT); digitalWrite(PIN_LIGHT_F, 0);
            restartDisplayUart();
            WiFi.softAP("Samsung_TuLanh_S3", "12345678");
            server.on("/", handleRoot);
            server.on("/u", []() {
              if (server.hasArg("p")) use8E1 = (server.arg("p").toInt() == 1);
              if (server.hasArg("inv")) invertTx = !invertTx;
              if (server.hasArg("b")) dispBaud = server.arg("b").toInt();
              if (server.hasArg("m")) scanMode = server.arg("m").toInt();
              restartDisplayUart();
              sendADT8700Packet();
              server.sendHeader("Location", "/");
              server.send(303);
            });
            server.on("/t", []() {
              String d = server.arg("d");
              if (d == "open") runDamper(true);
              if (d == "close") runDamper(false);
              server.sendHeader("Location", "/");
              server.send(303);
            });
            server.begin();
          }

          void loop() {
            server.handleClient();
            static unsigned long lastSend = 0;
            if (millis() - lastSend > 350) {
              lastSend = millis();
              sendADT8700Packet();
            }
            if (Serial1.available()) {
              lastRxHex = "";
              while (Serial1.available()) {
                uint8_t b = Serial1.read();
                if (b < 16) lastRxHex += "0";
                lastRxHex += String(b, HEX) + " ";
              }
            }
          }
          EOF

          pio run

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-samsung-s3
          name: Firmware Samsung S3 ADT8700A
          files: |
            .pio/build/esp32s3/bootloader.bin
            .pio/build/esp32s3/partitions.bin
            .pio/build/esp32s3/firmware.bin
            
