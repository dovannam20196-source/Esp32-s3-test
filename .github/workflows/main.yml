name: Build ESP32-38P DIO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core 2.0.17
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ~/.arduino15
          gh release download 2.0.17 -R espressif/arduino-esp32 -p package_esp32_index.json
          arduino-cli core update-index --additional-urls file://$(pwd)/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls file://$(pwd)/package_esp32_index.json

      - name: Compile Firmware DIO
        run: |
          CODE_FILE=$(find . -not -path '*/.*' \( -name "*.ino" -o -name "*.cpp" \) | head -n 1)
          mkdir -p /tmp/sketch
          cp "$CODE_FILE" /tmp/sketch/sketch.ino
          arduino-cli compile --fqbn esp32:esp32:esp32 --board-options FlashMode=dio --output-dir ./build /tmp/sketch

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Toshiba-ESP32-DIO
          path: ./build/*.bin
          
