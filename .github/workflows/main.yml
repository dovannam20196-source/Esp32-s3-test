name: Build ESP32-S3 DA92 5VScan
on: [push]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -U platformio
          mkdir -p src
          cat << 'EOF' > platformio.ini
          [env:esp32s3]
          platform = espressif32
          board = esp32-s3-devkitc-1
          framework = arduino
          EOF
          cat << 'EOF' > src/main.cpp
          #include <Arduino.h>
          #include <WiFi.h>
          #include <WebServer.h>

          int scanMode = 1;
          String rxHex = "Chua co";
          WebServer server(80);

          void setUart() {
            Serial1.end(); delay(50);
            if (scanMode == 1) Serial1.begin(9600, SERIAL_8E1, 16, 15, false);
            if (scanMode == 2) Serial1.begin(9600, SERIAL_8N1, 16, 15, false);
            if (scanMode == 3) Serial1.begin(4800, SERIAL_8E1, 16, 15, false);
            if (scanMode == 4) Serial1.begin(2400, SERIAL_8E1, 16, 15, false);
            if (scanMode == 5) Serial1.begin(1200, SERIAL_8E1, 16, 15, false);
          }

          void sendFrames() {
            // Goi 1: Header 0xAA 0x55 (14 byte)
            Serial1.write(0xAA); Serial1.write(0x55); Serial1.write(0x01); Serial1.write(0x0A);
            Serial1.write(0x04); Serial1.write(0x04); Serial1.write(0x00); Serial1.write(0x00);
            Serial1.write(0x00); Serial1.write(0x00); Serial1.write(0x00); Serial1.write(0x00);
            Serial1.write(0x00); Serial1.write(0x13);
            delay(40);
            // Goi 2: Header 0x55 0xAA (14 byte)
            Serial1.write(0x55); Serial1.write(0xAA); Serial1.write(0x01); Serial1.write(0x0A);
            Serial1.write(0x04); Serial1.write(0x04); Serial1.write(0x00); Serial1.write(0x00);
            Serial1.write(0x00); Serial1.write(0x00); Serial1.write(0x00); Serial1.write(0x00);
            Serial1.write(0x00); Serial1.write(0x13);
          }

          void handleRoot() {
            String h = "<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>";
            h += "<style>body{background:#111;color:#fff;font-family:sans-serif;padding:15px}button{padding:12px;margin:5px;font-size:15px;background:#0284c7;color:#fff;border:none;border-radius:8px}.act{background:#16a34a}</style></head><body>";
            h += "<h2>QUET DA92 (MACH DIODE 5V)</h2>";
            h += "<p>Che do dang chay: <b>" + String(scanMode) + "</b></p>";
            h += "<p>Phan hoi bo khien: <b>" + rxHex + "</b></p>";
            h += "<a href='/s?m=1'><button class='" + String(scanMode==1?"act":"") + "'>1. 9600 8E1</button></a>";
            h += "<a href='/s?m=2'><button class='" + String(scanMode==2?"act":"") + "'>2. 9600 8N1</button></a><br>";
            h += "<a href='/s?m=3'><button class='" + String(scanMode==3?"act":"") + "'>3. 4800 8E1</button></a>";
            h += "<a href='/s?m=4'><button class='" + String(scanMode==4?"act":"") + "'>4. 2400 8E1</button></a>";
            h += "<a href='/s?m=5'><button class='" + String(scanMode==5?"act":"") + "'>5. 1200 8E1</button></a>";
            h += "</body></html>";
            server.send(200, "text/html", h);
          }

          void setup() {
            pinMode(17, OUTPUT); digitalWrite(17, 1);
            setUart();
            WiFi.softAP("Samsung_TuLanh_S3", "12345678");
            server.on("/", handleRoot);
            server.on("/s", [](){
              if(server.hasArg("m")) scanMode = server.arg("m").toInt();
              setUart();
              server.sendHeader("Location", "/"); server.send(303);
            });
            server.begin();
          }

          void loop() {
            server.handleClient();
            static unsigned long t = 0;
            if (millis() - t > 250) { t = millis(); sendFrames(); }
            if (Serial1.available()) {
              if (rxHex == "Chua co") rxHex = "";
              while (Serial1.available()) {
                uint8_t b = Serial1.read();
                if (b < 16) rxHex += "0";
                rxHex += String(b, HEX) + " ";
              }
            }
          }
          EOF
          pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: .pio/build/esp32s3/*.bin
          
