name: Build ESP32-S3 Test DA92 Display
on: [push]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -U platformio
          mkdir -p src
          cat << 'EOF' > platformio.ini
          [env:esp32s3]
          platform = espressif32
          board = esp32-s3-devkitc-1
          framework = arduino
          EOF
          cat << 'EOF' > src/main.cpp
          #include <Arduino.h>
          #include <WiFi.h>
          #include <WebServer.h>

          int protoMode = 1; // 1: 1200 8E1 thuong, 2: 2400 8E1 thuong, 3: 1200 8E1 dao cuc, 4: 2400 8E1 dao cuc, 5: 4800 8N1
          bool swapPin = false;
          String rxHex = "Chua nhan duoc";
          WebServer server(80);

          void setupDisplayUart() {
            Serial1.end();
            delay(50);
            int rx = swapPin ? 15 : 16;
            int tx = swapPin ? 16 : 15;
            if (protoMode == 1) Serial1.begin(1200, SERIAL_8E1, rx, tx, false);
            if (protoMode == 2) Serial1.begin(2400, SERIAL_8E1, rx, tx, false);
            if (protoMode == 3) Serial1.begin(1200, SERIAL_8E1, rx, tx, true);
            if (protoMode == 4) Serial1.begin(2400, SERIAL_8E1, rx, tx, true);
            if (protoMode == 5) Serial1.begin(4800, SERIAL_8N1, rx, tx, false);
          }

          void sendSamsung14Byte() {
            // Khung chuan 14-byte Samsung DA92 (Header 0x55 0xAA + LED ngan da/mat + Checksum)
            uint8_t b0=0x55, b1=0xAA, b2=0x00, b3=0x0E, b4=0x01, b5=0x04, b6=0x04, b7=0x00, b8=0x00, b9=0x00, b10=0x00, b11=0x00, b12=0x00;
            uint8_t cs = b2 + b3 + b4 + b5 + b6 + b7 + b8 + b9 + b10 + b11 + b12;
            Serial1.write(b0); Serial1.write(b1); Serial1.write(b2); Serial1.write(b3);
            Serial1.write(b4); Serial1.write(b5); Serial1.write(b6); Serial1.write(b7);
            Serial1.write(b8); Serial1.write(b9); Serial1.write(b10); Serial1.write(b11);
            Serial1.write(b12); Serial1.write(cs);
          }

          void handleRoot() {
            String h = "<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>";
            h += "<style>body{background:#111;color:#fff;font-family:sans-serif;padding:15px}button{padding:12px;margin:5px;font-size:15px;background:#0284c7;color:#fff;border:none;border-radius:8px}.act{background:#16a34a}</style></head><body>";
            h += "<h2>TEST BO KHIEN DA92-01137A</h2>";
            h += "<p>Che do dang chay: <b>" + String(protoMode) + "</b> | Chan: <b>" + (swapPin ? "TX=16 / RX=15" : "TX=15 / RX=16") + "</b></p>";
            h += "<p>Du lieu bo khien gui ve: <b>" + rxHex + "</b></p>";
            h += "<a href='/m?p=1'><button class='" + String(protoMode==1?"act":"") + "'>1. 1200 8E1 Thuong</button></a><br>";
            h += "<a href='/m?p=2'><button class='" + String(protoMode==2?"act":"") + "'>2. 2400 8E1 Thuong</button></a><br>";
            h += "<a href='/m?p=3'><button class='" + String(protoMode==3?"act":"") + "'>3. 1200 8E1 Dao Cuc</button></a><br>";
            h += "<a href='/m?p=4'><button class='" + String(protoMode==4?"act":"") + "'>4. 2400 8E1 Dao Cuc</button></a><br>";
            h += "<a href='/m?p=5'><button class='" + String(protoMode==5?"act":"") + "'>5. 4800 8N1 Thuong</button></a><br><br>";
            h += "<a href='/m?s=1'><button>Dao Chieu TX/RX</button></a>";
            h += "<a href='/clear'><button>Xoa Bo Dem Nhan</button></a>";
            h += "</body></html>";
            server.send(200, "text/html", h);
          }

          void setup() {
            pinMode(17, OUTPUT); digitalWrite(17, 1);
            setupDisplayUart();
            WiFi.softAP("Samsung_TuLanh_S3", "12345678");
            server.on("/", handleRoot);
            server.on("/m", [](){
              if(server.hasArg("p")) protoMode = server.arg("p").toInt();
              if(server.hasArg("s")) swapPin = !swapPin;
              setupDisplayUart();
              server.sendHeader("Location", "/"); server.send(303);
            });
            server.on("/clear", [](){
              rxHex = "Chua nhan duoc";
              server.sendHeader("Location", "/"); server.send(303);
            });
            server.begin();
          }

          void loop() {
            server.handleClient();
            static unsigned long t = 0;
            if (millis() - t > 300) {
              t = millis();
              sendSamsung14Byte();
            }
            if (Serial1.available()) {
              if (rxHex == "Chua nhan duoc") rxHex = "";
              while (Serial1.available()) {
                uint8_t b = Serial1.read();
                if (b < 16) rxHex += "0";
                rxHex += String(b, HEX) + " ";
              }
            }
          }
          EOF
          pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: .pio/build/esp32s3/*.bin
          
