name: Build ESP32-S3 Samsung Damper Sens
on: [push]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -U platformio
          mkdir -p src
          cat << 'EOF' > platformio.ini
          [env:esp32s3]
          platform = espressif32
          board = esp32-s3-devkitc-1
          framework = arduino
          EOF
          cat << 'EOF' > src/main.cpp
          #include <Arduino.h>
          #include <WiFi.h>
          #include <WebServer.h>

          int dmP0 = 4, dmP1 = 5, dmP2 = 6, dmP3 = 7;
          int dmMode = 1;
          bool defOn = false;
          unsigned long lightTimerR = 0;
          WebServer server(80);

          void setDm(int m) {
            dmMode = m;
            if (m == 1) { dmP0=4; dmP1=5; dmP2=6; dmP3=7; }
            if (m == 2) { dmP0=4; dmP1=6; dmP2=5; dmP3=7; }
            if (m == 3) { dmP0=4; dmP1=6; dmP2=7; dmP3=5; }
            pinMode(dmP0, OUTPUT); pinMode(dmP1, OUTPUT);
            pinMode(dmP2, OUTPUT); pinMode(dmP3, OUTPUT);
          }

          void runDm(bool open) {
            for (int s = 0; s < 500; s++) {
              int i = open ? (s % 4) : (3 - (s % 4));
              digitalWrite(dmP0, i==0 || i==3);
              digitalWrite(dmP1, i==0 || i==1);
              digitalWrite(dmP2, i==1 || i==2);
              digitalWrite(dmP3, i==2 || i==3);
              delay(8);
            }
            digitalWrite(dmP0, 0); digitalWrite(dmP1, 0);
            digitalWrite(dmP2, 0); digitalWrite(dmP3, 0);
          }

          float readNTC(int pin, bool isParallel) {
            int adc = analogRead(pin);
            if (adc < 80 || adc > 4010) return -99.0;
            float r_ntc = 3600.0 * ((float)adc / (4095.0 - adc));
            if (isParallel) r_ntc = r_ntc * 2.0;
            float steinhart = log(r_ntc / 5000.0) / 3950.0 + 1.0 / (25.0 + 273.15);
            return (1.0 / steinhart) - 273.15;
          }

          void handleRoot() {
            float tCom = readNTC(1, true);
            float tDef = readNTC(2, false);
            float tAmb = readNTC(3, false);
            bool dF = (digitalRead(8) == LOW);
            bool dR = (digitalRead(9) == LOW);

            String h = "<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>";
            h += "<style>body{background:#111;color:#fff;font-family:sans-serif;padding:12px}.card{background:#222;padding:12px;border-radius:8px;margin-bottom:10px}button{padding:11px;margin:4px;font-size:14px;background:#0284c7;color:#fff;border:none;border-radius:6px}.act{background:#16a34a}</style></head><body>";
            h += "<h2>TEST DAMPER - CAM BIEN - CUA</h2>";

            h += "<div class='card'><b>1. Cua Gio Damper (Pha " + String(dmMode) + ")</b><br>";
            h += "<a href='/dm?m=1'><button class='" + String(dmMode==1?"act":"") + "'>Pha 1</button></a>";
            h += "<a href='/dm?m=2'><button class='" + String(dmMode==2?"act":"") + "'>Pha 2</button></a>";
            h += "<a href='/dm?m=3'><button class='" + String(dmMode==3?"act":"") + "'>Pha 3</button></a><br>";
            h += "<a href='/t?c=open'><button>MO DAMPER</button></a><a href='/t?c=close'><button>DONG DAMPER</button></a></div>";

            h += "<div class='card'><b>2. Cam Bien & Cong Tac Cua</b><br>";
            h += "CB Da+Mat (1): <b>" + (tCom < -90 ? String("Chua noi") : String(tCom, 1) + "C") + "</b><br>";
            h += "CB Dan Xa Da (2): <b>" + (tDef < -90 ? String("Chua noi") : String(tDef, 1) + "C") + "</b><br>";
            h += "CB Moi Truong (3): <b>" + (tAmb < -90 ? String("Chua noi") : String(tAmb, 1) + "C") + "</b><br><br>";
            h += "Cua Da (8): <b>" + String(dF ? "DANG MO" : "Dong") + "</b> | ";
            h += "Cua Mat (9): <b>" + String(dR ? "DANG MO" : "Dong") + "</b></div>";

            h += "<div class='card'><b>3. Test Tai Da Chay OK</b><br>";
            h += "<a href='/t?c=fan'><button>Quat (20)</button></a><a href='/t?c=def'><button>Xa Da (21)</button></a>";
            h += "<a href='/t?c=lr'><button>Den Mat (17)</button></a><a href='/t?c=lf'><button>Den Da (18)</button></a></div>";
            h += "</body></html>";
            server.send(200, "text/html", h);
          }

          void setup() {
            pinMode(17, OUTPUT); pinMode(18, OUTPUT);
            pinMode(20, OUTPUT); pinMode(21, OUTPUT);
            pinMode(8, INPUT_PULLUP); pinMode(9, INPUT_PULLUP);
            digitalWrite(17, 1);
            setDm(1);
            WiFi.softAP("Samsung_TuLanh_S3", "12345678");
            server.on("/", handleRoot);
            server.on("/dm", [](){ setDm(server.arg("m").toInt()); server.sendHeader("Location","/"); server.send(303); });
            server.on("/t", [](){
              String c = server.arg("c");
              if(c=="open") runDm(true);
              if(c=="close") runDm(false);
              if(c=="fan") digitalWrite(20, !digitalRead(20));
              if(c=="def") { defOn = !defOn; digitalWrite(21, defOn); }
              if(c=="lr") digitalWrite(17, !digitalRead(17));
              if(c=="lf") digitalWrite(18, !digitalRead(18));
              server.sendHeader("Location","/"); server.send(303);
            });
            server.begin();
            lightTimerR = millis();
          }

          void loop() {
            server.handleClient();
            if (digitalRead(9) == LOW) { digitalWrite(17, 1); lightTimerR = millis(); }
            else if (millis() - lightTimerR > 10000) { digitalWrite(17, 0); }
            digitalWrite(18, digitalRead(8) == LOW ? 1 : 0);
          }
          EOF
          pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: .pio/build/esp32s3/*.bin
          
