name: Build ESP32-38P Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://github.io
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir ./build ./Toshiba_ESP32
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Toshiba-ESP32-Test
          path: ./build/*.bin
          
