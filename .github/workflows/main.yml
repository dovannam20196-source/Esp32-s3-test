// Khai báo 3 chân điều khiển Damper
const int DAMPER_PINS[3] = {5, 6, 7};

void setup() {
  for (int i = 0; i < 3; i++) {
    pinMode(DAMPER_PINS[i], OUTPUT);
    digitalWrite(DAMPER_PINS[i], LOW); // Mặc định ngắt điện cuộn dây
  }
  
  // Chạy test ngay khi cấp nguồn: Mở cửa gió -> nghỉ 2 giây -> Đóng cửa gió
  quayDamper(true, 180);   // Mở cửa gió (180 chu kỳ)
  delay(2000);
  quayDamper(false, 180);  // Đóng cửa gió (180 chu kỳ)
}

void loop() {
  // Để trống hoặc đưa vào logic điều khiển nhiệt độ chính của tủ
}

// Hàm điều khiển quay Damper 3 pha (moCua = true: Mở, false: Đóng)
void quayDamper(bool moCua, int soVong) {
  for (int v = 0; v < soVong; v++) {
    for (int step = 0; step < 3; step++) {
      int idx = moCua ? step : (2 - step); // Đảo thứ tự pha khi đóng cửa
      
      // Chỉ bật 1 pha tại 1 thời điểm
      for (int p = 0; p < 3; p++) {
        digitalWrite(DAMPER_PINS[p], (p == idx) ? HIGH : LOW);
      }
      delay(5); // Trễ 5ms mỗi bước để bánh răng kéo khỏe, không trượt bước
    }
  }
  // Ngắt điện hoàn toàn cả 3 pha sau khi quay xong để tránh nóng cuộn dây
  for (int i = 0; i < 3; i++) {
    digitalWrite(DAMPER_PINS[i], LOW);
  }
}
